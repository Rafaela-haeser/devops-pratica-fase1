name: CI/CD - DevOps Fase 2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: CI - Testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Executar testes automatizados
        run: npm test

      - name: Executar build da aplicacao
        run: npm run build

      - name: Publicar artefato da aplicacao
        uses: actions/upload-artifact@v4
        with:
          name: dist-app
          path: dist

  terraform-validate:
    name: IaC - Validar Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Inicializar Terraform sem backend remoto
        run: terraform init -backend=false

      - name: Verificar formatacao dos arquivos Terraform
        run: terraform fmt -check -recursive

      - name: Validar configuracao Terraform
        run: terraform validate

  container:
    name: Container - Build e validacao Docker
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t devops-pratica-fase2:${{ github.sha }} .

      - name: Executar container para validacao
        run: |
          docker run -d --name devops-fase2 -p 8080:80 devops-pratica-fase2:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:8080/health

      - name: Salvar imagem Docker como artefato
        run: docker save devops-pratica-fase2:${{ github.sha }} -o devops-pratica-fase2-image.tar

      - name: Publicar artefato da imagem Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devops-pratica-fase2-image.tar

  security:
    name: Security - Auditoria de dependencias
    runs-on: ubuntu-latest
    needs:
      - ci

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Executar npm audit
        run: npm audit --audit-level=high

  cd:
    name: CD - Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - ci
      - terraform-validate
      - container
      - security
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar artefato da aplicacao
        uses: actions/download-artifact@v4
        with:
          name: dist-app
          path: dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
